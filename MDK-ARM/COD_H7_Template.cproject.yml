project:
  packs:
    - pack: ARM::CMSIS@^6.1.0
    - pack: Keil::STM32H7xx_DFP@^4.1.3
    - pack: ARM::CMSIS-NN@^4.0.0
    - pack: ARM::CMSIS-DSP@^1.10.1
  setups:
    - setup: Options for COD_H7_Template
      processor:
        fpu: dp
      add-path:
        - ../Core/Inc
        - ../Drivers/STM32H7xx_HAL_Driver/Inc
        - ../Drivers/STM32H7xx_HAL_Driver/Inc/Legacy
        - ../Drivers/CMSIS/Device/ST/STM32H7xx/Include
        - ../Drivers/CMSIS/Include
        - ../Middlewares/Third_Party/FreeRTOS/Source/include
        - ../Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS
        - ../Middlewares/Third_Party/FreeRTOS/Source/portable/RVDS/ARM_CM4F
        - ../Application/Task/Inc
        - ../Components/Device/Inc
        - ../Components/Controller/Inc
        - ../Components/Algorithm/Inc
        - ../BSP/Inc
        - ../SystemView/SEGGER/Syscalls
        - ../SystemView/Sample/FreeRTOSV10
        - ../SystemView/Sample/FreeRTOSV10/Patch
        - ../SystemView/Config
        - ../SystemView/SEGGER
        - ../Middlewares/ST/ARM/DSP/Inc
        - ../USB_DEVICE/App
        - ../USB_DEVICE/Target
        - ../Middlewares/ST/STM32_USB_Device_Library/Core/Inc
        - ../Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Inc
      debug: "on"
      define:
        - USE_HAL_DRIVER
        - STM32H723xx
        - ARM_MATH_CM7
        - __FPU_PRESENT: 1U
        - ARM_MATH_CHECK
      misc:
        - C:
            - -std=c99
          C-CPP:
            - -fno-rtti
            - -funsigned-char
            - -fshort-enums
            - -fshort-wchar
            - -ffunction-sections
            - -Wno-packed
            - -Wno-missing-variable-declarations
            - -Wno-missing-prototypes
            - -Wno-missing-noreturn
            - -Wno-sign-conversion
            - -Wno-nonportable-include-path
            - -Wno-reserved-id-macro
            - -Wno-unused-macros
            - -Wno-documentation-unknown-command
            - -Wno-documentation
            - -Wno-license-management
            - -Wno-parentheses-equality
          CPP:
            - -xc++
            - -std=c++11
            - -fno-exceptions
          ASM:
            - -masm=auto
          Link:
            - --map
            - --load_addr_map_info
            - --xref
            - --callgraph
            - --symbols
            - --info sizes
            - --info totals
            - --info unused
            - --info veneers
            - --strict
            - --summary_stderr
            - --info summarysizes
  linker:
    - script: COD_H7_Template/COD_H7_Template.sct
  groups:
    - group: Application/User/Core
      files:
        - file: ../Core/Src/main.c
        - file: ../Core/Src/gpio.c
        - file: ../Core/Src/freertos.c
          misc:
            - CPP:
                - -xc++
        - file: ../Core/Src/adc.c
          misc:
            - CPP:
                - -xc++
        - file: ../Core/Src/bdma.c
          misc:
            - CPP:
                - -xc++
        - file: ../Core/Src/dma.c
          misc:
            - CPP:
                - -xc++
        - file: ../Core/Src/fdcan.c
        - file: ../Core/Src/i2c.c
          misc:
